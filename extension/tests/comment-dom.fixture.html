<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'none'; style-src 'unsafe-inline'; connect-src 'none'">
<title>评论采集 DOM 回归测试</title>
<style>
body{font:14px system-ui;margin:28px;color:#17212e;background:#f5f6f8}button{padding:10px 16px}li{padding:5px}
#mount{position:fixed;right:24px;top:24px;width:440px;background:white;border:1px solid #ccc;padding:12px}
.fixture-root{max-height:400px;overflow-y:auto}.comment-item{padding:12px;border-bottom:1px solid #ddd}
.avatar img{width:16px;height:16px}.pictures img{width:72px;height:64px}.comment-item-sub{margin-left:24px}
.total{padding:12px}.date{font-size:11px;color:#677}.name{font-weight:600}.content{padding:8px 0}

<p id="metrics" aria-label="实测耗时"></p>
<ol id="results"></ol><div id="mount"></div>
